name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base \
            autoconf automake cmake libffi-dev libtool pkg-config \
            zip unzip openjdk-17-jdk

      - name: Instalar Buildozer e dependencias Python
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython
          pip install appdirs colorama jinja2 "sh>=2,<3" meson ninja build toml packaging

      - name: Compilar APK
        working-directory: android
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cademeuonibus-apk
          path: android/bin/*.apk
